<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jen pro Tebe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #050711;
            --bg-mid: #0d1226;
            --bg-bot: #1a162b;
            --gold: #e6c687;
            --gold-dim: rgba(230, 198, 135, 0.25);
            --rose: #d46a7e;
            --text-main: #f4efe6;
            --text-muted: #a39bb0;
            --panel-bg: rgba(12, 14, 26, 0.78);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-top);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #skyCanvas { z-index: 1; cursor: crosshair; }
        #bouquetCanvas { z-index: 2; pointer-events: none; }


        .header-note {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
            pointer-events: none;
            width: 92%;
            max-width: 560px;
        }

        .header-note .subtitle {
            font-size: 0.72rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.85;
            margin-bottom: 4px;
        }

        .header-note h1 {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 500;
            font-style: italic;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: var(--text-main);
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            line-height: 1.2;
        }

        .header-note .sky-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.65;
            margin-top: 4px;
        }


        .atelier-dock {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            width: 94%;
            max-width: 680px;
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--gold-dim);
            border-radius: 20px;
            padding: 14px 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .dock-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dock-label span.status {
            color: var(--gold);
            font-weight: 500;
            letter-spacing: 0.04em;
            text-transform: none;
        }

        /* Přepínače jednotlivých druhů květin */
        .flower-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .flower-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.09);
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .flower-chip:hover {
            border-color: rgba(230, 198, 135, 0.4);
            color: var(--text-main);
        }

        .flower-chip.active {
            background: rgba(230, 198, 135, 0.14);
            border-color: var(--gold);
            color: var(--text-main);
            box-shadow: 0 2px 12px rgba(230, 198, 135, 0.15);
        }

        .flower-chip .swatch {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px currentColor;
            opacity: 0.45;
            transition: opacity 0.2s, transform 0.2s;
        }

        .flower-chip.active .swatch {
            opacity: 1;
            transform: scale(1.15);
        }

        /* Akční tlačítka */
        .dock-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.86rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4a359 0%, #b88238 100%);
            color: #0d0b14;
            box-shadow: 0 4px 18px rgba(212, 163, 89, 0.28);
        }

        .btn-primary:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-surprise {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border-color: rgba(230, 198, 135, 0.35);
        }

        .btn-surprise:hover {
            background: rgba(230, 198, 135, 0.12);
            border-color: var(--gold);
        }

        @media (max-width: 520px) {
            .atelier-dock {
                padding: 12px 12px;
                bottom: 10px;
            }
            .flower-chip {
                padding: 6px 10px;
                font-size: 0.76rem;
            }
            .btn {
                padding: 9px 12px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>


    <canvas id="skyCanvas"></canvas>


    <canvas id="bouquetCanvas"></canvas>


    <div class="header-note">
        <div class="subtitle">Pro Lucinku ❤️</div>
        <h1 id="quoteText">„Když zapomenu koupit živou, tahle ti pod hvězdami nikdy neuvadne.“</h1>
        <div class="sky-hint">Tip: Klikni kamkoliv na noční oblohu pro padající hvězdu</div>
    </div>


    <div class="atelier-dock">
        <div class="dock-label">
            <span>Vyber si květiny do kytice</span>
            <span class="status" id="selectionStatus">Vybráno: 4 druhy</span>
        </div>

        <div class="flower-selector" id="flowerSelector">
            <button class="flower-chip active" data-type="rose">
                <span class="swatch" style="background:#e11d48; color:#e11d48;"></span>Růže
            </button>
            <button class="flower-chip active" data-type="tulip">
                <span class="swatch" style="background:#f472b6; color:#f472b6;"></span>Tulipány
            </button>
            <button class="flower-chip active" data-type="daisy">
                <span class="swatch" style="background:#fef08a; color:#fef08a;"></span>Kopretiny
            </button>
            <button class="flower-chip" data-type="sunflower">
                <span class="swatch" style="background:#f59e0b; color:#f59e0b;"></span>Slunečnice
            </button>
            <button class="flower-chip active" data-type="lavender">
                <span class="swatch" style="background:#a78bfa; color:#a78bfa;"></span>Levandule
            </button>
            <button class="flower-chip" data-type="lily">
                <span class="swatch" style="background:#fda4af; color:#fda4af;"></span>Lilie
            </button>
        </div>

        <div class="dock-actions">
            <button class="btn btn-primary" id="btnBind">Uvázat vybranou kytici</button>
            <button class="btn btn-surprise" id="btnSurprise">Nevím, překvap mě ✨</button>
        </div>
    </div>

<script>
(() => {
    const skyCanvas = document.getElementById('skyCanvas');
    const skyCtx = skyCanvas.getContext('2d');
    const bqCanvas = document.getElementById('bouquetCanvas');
    const bqCtx = bqCanvas.getContext('2d');

    const quoteEl = document.getElementById('quoteText');
    const statusEl = document.getElementById('selectionStatus');
    const chips = Array.from(document.querySelectorAll('.flower-chip'));

    const quotes = [
        "„Když zapomenu koupit živou, tahle ti pod hvězdami nikdy neuvadne.“",
        "„Každý stonek a každý lístek je tu nakreslený jen pro tebe.“",
        "„I když mám občas děravou hlavu, myslím na tebe pořád.“",
        "„Přej si něco u padající hvězdy a nech si uvázat další.“",
        "„Čerstvě natrhaná půlnoční kytice, která nepotřebuje vázu.“"
    ];

    let W = window.innerWidth;
    let H = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    const rand = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));
    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));


    let stars = [];
    let fireflies = [];
    let shootingStars = [];

    function initSky() {
        stars = [];
        const starCount = Math.floor((W * H) / 6500);
        const starColors = ['#ffffff', '#ffe9c4', '#d4fbff', '#f3e8ff'];

        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * (H * 0.85),
                r: Math.random() < 0.85 ? rand(0.5, 1.4) : rand(1.5, 2.4),
                baseAlpha: rand(0.25, 0.9),
                twinkleSpeed: rand(0.0015, 0.005),
                phase: rand(0, Math.PI * 2),
                color: starColors[randInt(0, starColors.length - 1)],
                sparkle: Math.random() < 0.07
            });
        }

        fireflies = [];
        const flyCount = W < 600 ? 18 : 30;
        for (let i = 0; i < flyCount; i++) {
            fireflies.push({
                x: rand(W * 0.1, W * 0.9),
                y: rand(H * 0.15, H * 0.85),
                vx: rand(-0.25, 0.25),
                vy: rand(-0.35, -0.08),
                r: rand(1.5, 3.2),
                phase: rand(0, Math.PI * 2),
                speed: rand(0.02, 0.045)
            });
        }
    }

    function spawnShootingStar(customX, customY) {
        const startX = customX !== undefined ? customX : rand(W * 0.15, W * 0.95);
        const startY = customY !== undefined ? customY : rand(20, H * 0.38);
        const angle = rand(Math.PI * 0.68, Math.PI * 0.82); // Letí šikmo dolů doleva
        const speed = rand(11, 17);

        shootingStars.push({
            x: startX,
            y: startY,
            vx: Math.cos(angle) * speed,
            vy: -Math.sin(angle) * speed, // kladné Y směrem dolů
            len: rand(90, 160),
            life: 1.0,
            decay: rand(0.014, 0.024),
            width: rand(1.4, 2.4)
        });
    }


    skyCanvas.addEventListener('pointerdown', (e) => {
        spawnShootingStar(e.clientX, e.clientY);
    });

    function renderSky(time) {

        const grad = skyCtx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#04060f');
        grad.addColorStop(0.45, '#0b1024');
        grad.addColorStop(0.8, '#17152e');
        grad.addColorStop(1, '#22182e');
        skyCtx.fillStyle = grad;
        skyCtx.fillRect(0, 0, W, H);

        const glow = skyCtx.createRadialGradient(W * 0.5, H * 0.45, 10, W * 0.5, H * 0.45, Math.max(W, H) * 0.48);
        glow.addColorStop(0, 'rgba(140, 95, 160, 0.12)');
        glow.addColorStop(0.5, 'rgba(70, 50, 110, 0.05)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        skyCtx.fillStyle = glow;
        skyCtx.fillRect(0, 0, W, H);


        for (const s of stars) {
            const alpha = s.baseAlpha * (0.65 + 0.35 * Math.sin(time * s.twinkleSpeed + s.phase));
            skyCtx.save();
            skyCtx.globalAlpha = clamp(alpha, 0.05, 1);
            skyCtx.fillStyle = s.color;
            skyCtx.beginPath();
            skyCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            skyCtx.fill();


            if (s.sparkle && alpha > 0.6) {
                skyCtx.strokeStyle = s.color;
                skyCtx.lineWidth = 0.6;
                const flare = s.r * 3.8;
                skyCtx.beginPath();
                skyCtx.moveTo(s.x - flare, s.y);
                skyCtx.lineTo(s.x + flare, s.y);
                skyCtx.moveTo(s.x, s.y - flare);
                skyCtx.lineTo(s.x, s.y + flare);
                skyCtx.stroke();
            }
            skyCtx.restore();
        }


        if (Math.random() < 0.012 && shootingStars.length < 3) {
            spawnShootingStar();
        }


        for (let i = shootingStars.length - 1; i >= 0; i--) {
            const st = shootingStars[i];
            st.x += st.vx;
            st.y -= st.vy; // posun dol ů
            st.life -= st.decay;

            if (st.life <= 0 || st.x < -200 || st.y > H + 200) {
                shootingStars.splice(i, 1);
                continue;
            }

            const speedMag = Math.hypot(st.vx, st.vy);
            const tailX = st.x - (st.vx / speedMag) * st.len * st.life;
            const tailY = st.y + (st.vy / speedMag) * st.len * st.life;

            skyCtx.save();
            const tailGrad = skyCtx.createLinearGradient(st.x, st.y, tailX, tailY);
            tailGrad.addColorStop(0, `rgba(255, 250, 235, ${st.life})`);
            tailGrad.addColorStop(0.25, `rgba(230, 198, 135, ${st.life * 0.6})`);
            tailGrad.addColorStop(1, 'rgba(230, 198, 135, 0)');

            skyCtx.strokeStyle = tailGrad;
            skyCtx.lineWidth = st.width;
            skyCtx.lineCap = 'round';
            skyCtx.beginPath();
            skyCtx.moveTo(st.x, st.y);
            skyCtx.lineTo(tailX, tailY);
            skyCtx.stroke();


            skyCtx.fillStyle = `rgba(255, 255, 255, ${st.life})`;
            skyCtx.beginPath();
            skyCtx.arc(st.x, st.y, st.width * 1.1, 0, Math.PI * 2);
            skyCtx.fill();
            skyCtx.restore();
        }


        for (const f of fireflies) {
            f.x += f.vx + Math.sin(time * 0.001 + f.phase) * 0.15;
            f.y += f.vy;
            f.phase += f.speed;

            if (f.y < H * 0.08) {
                f.y = H * 0.82;
                f.x = rand(W * 0.15, W * 0.85);
            }

            const pulse = 0.5 + 0.5 * Math.sin(f.phase);
            skyCtx.save();
            const fGrad = skyCtx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 3.5);
            fGrad.addColorStop(0, `rgba(255, 230, 150, ${0.75 * pulse})`);
            fGrad.addColorStop(0.4, `rgba(230, 185, 90, ${0.3 * pulse})`);
            fGrad.addColorStop(1, 'rgba(230, 185, 90, 0)');
            skyCtx.fillStyle = fGrad;
            skyCtx.beginPath();
            skyCtx.arc(f.x, f.y, f.r * 3.5, 0, Math.PI * 2);
            skyCtx.fill();
            skyCtx.restore();
        }
    }


    function subdivideCubicBezier(p0, p1, p2, p3, t) {
        const lerp = (a, b, u) => ({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u });
        const q0 = p0;
        const q1 = lerp(p0, p1, t);
        const m1 = lerp(p1, p2, t);
        const r2 = lerp(p2, p3, t);
        const q2 = lerp(q1, m1, t);
        const r1 = lerp(m1, r2, t);
        const q3 = lerp(q2, r1, t);
        return { q0, q1, q2, q3 };
    }

    function evalCubicPoint(p0, p1, p2, p3, t) {
        const mt = 1 - t;
        const mt2 = mt * mt;
        const t2 = t * t;
        return {
            x: mt2 * mt * p0.x + 3 * mt2 * t * p1.x + 3 * mt * t2 * p2.x + t2 * t * p3.x,
            y: mt2 * mt * p0.y + 3 * mt2 * t * p1.y + 3 * mt * t2 * p2.y + t2 * t * p3.y
        };
    }

    function evalCubicTangentAngle(p0, p1, p2, p3, t) {
        const mt = 1 - t;
        const dx = 3 * mt * mt * (p1.x - p0.x) + 6 * mt * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x);
        const dy = 3 * mt * mt * (p1.y - p0.y) + 6 * mt * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y);
        return Math.atan2(dy, dx);
    }



    function drawCalyx(ctx, size, color = '#28522a') {
        ctx.save();
        ctx.fillStyle = color;
        // Lůžko květu, které plynule obepne špičku stonku
        ctx.beginPath();
        ctx.arc(0, 1, size * 0.16, 0, Math.PI * 2);
        ctx.fill();

        // Kališní lístky
        for (let i = -1; i <= 1; i++) {
            ctx.save();
            ctx.rotate(i * 0.48);
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.quadraticCurveTo(-size * 0.12, -size * 0.22, 0, -size * 0.42);
            ctx.quadraticCurveTo(size * 0.12, -size * 0.22, 0, 2);
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
    }


    function renderRose(ctx, size, bloom, variant) {
        const s = size * bloom;
        drawCalyx(ctx, s * 0.85, '#254d27');

        ctx.save();

        ctx.translate(0, -s * 0.22);

        const palettes = [
            { h: 348, s: 82, lBase: 36 }, // Temně rudá sametová
            { h: 355, s: 78, lBase: 48 }, // Klasická červená
            { h: 338, s: 75, lBase: 64 }, // Čajová růžová
            { h: 12,  s: 80, lBase: 62 }  // Lososově korálová
        ];
        const pal = palettes[variant % palettes.length];

        // Vnější až vnitřní prstence lístků
        const rings = 5;
        for (let r = rings; r >= 1; r--) {
            const ratio = r / rings;
            const rad = s * (0.22 + ratio * 0.68);
            const petalCount = r === 1 ? 4 : (r === 2 ? 5 : 6);
            const light = pal.lBase + (1 - ratio) * 22;
            const dark = pal.lBase - ratio * 14;

            for (let i = 0; i < petalCount; i++) {
                const angle = (i / petalCount) * Math.PI * 2 + r * 0.65;
                ctx.save();
                ctx.rotate(angle);

                const pGrad = ctx.createRadialGradient(0, -rad * 0.3, rad * 0.1, 0, -rad * 0.5, rad);
                pGrad.addColorStop(0, `hsl(${pal.h}, ${pal.s}%, ${dark}%)`);
                pGrad.addColorStop(0.75, `hsl(${pal.h}, ${pal.s}%, ${light}%)`);
                pGrad.addColorStop(1, `hsl(${pal.h}, ${pal.s}%, ${Math.min(88, light + 10)}%)`);

                ctx.fillStyle = pGrad;
                ctx.strokeStyle = `hsla(${pal.h}, ${pal.s}%, ${dark - 8}%, 0.45)`;
                ctx.lineWidth = 0.8;


                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-rad * 0.75, -rad * 0.2, -rad * 0.85, -rad * 0.95, 0, -rad);
                ctx.bezierCurveTo(rad * 0.85, -rad * 0.95, rad * 0.75, -rad * 0.2, 0, 0);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }


        ctx.fillStyle = `hsl(${pal.h}, ${pal.s}%, ${pal.lBase - 12}%)`;
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.16, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function renderTulip(ctx, size, bloom, variant) {
        const s = size * bloom;
        // Jemný kalich na špičce stonku
        ctx.fillStyle = '#336936';
        ctx.beginPath();
        ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2);
        ctx.fill();

        const palettes = [
            { h: 330, s: 82, l: 60, tip: 78 }, // Růžový tulipán
            { h: 42,  s: 95, l: 56, tip: 75 }, // Žlutý tulipán
            { h: 350, s: 85, l: 50, tip: 68 }, // Šarlatový tulipán
            { h: 285, s: 65, l: 55, tip: 75 }  // Fialový
        ];
        const pal = palettes[variant % palettes.length];
        const openSpread = 0.16 * bloom;


        for (let side of [-1, 0, 1]) {
            ctx.save();
            ctx.rotate(side * (0.14 + openSpread * 0.5));
            const grad = ctx.createLinearGradient(0, 0, 0, -s * 1.15);
            grad.addColorStop(0, `hsl(${pal.h}, ${pal.s}%, ${pal.l - 14}%)`);
            grad.addColorStop(0.7, `hsl(${pal.h}, ${pal.s}%, ${pal.l}%)`);
            grad.addColorStop(1, `hsl(${pal.h}, ${pal.s}%, ${pal.tip}%)`);
            ctx.fillStyle = grad;

            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.bezierCurveTo(-s * 0.36, -s * 0.3, -s * 0.32, -s * 0.95, 0, -s * 1.12);
            ctx.bezierCurveTo(s * 0.32, -s * 0.95, s * 0.36, -s * 0.3, 0, 2);
            ctx.fill();
            ctx.restore();
        }


        for (let side of [-1, 1]) {
            ctx.save();
            ctx.rotate(side * (0.18 + openSpread));
            const grad = ctx.createLinearGradient(0, 0, 0, -s * 1.08);
            grad.addColorStop(0, `hsl(${pal.h}, ${pal.s}%, ${pal.l - 8}%)`);
            grad.addColorStop(0.65, `hsl(${pal.h}, ${pal.s}%, ${pal.l + 5}%)`);
            grad.addColorStop(1, `hsl(${pal.h}, ${pal.s}%, ${pal.tip + 5}%)`);
            ctx.fillStyle = grad;
            ctx.strokeStyle = `hsla(${pal.h}, ${pal.s}%, ${pal.l - 18}%, 0.4)`;
            ctx.lineWidth = 0.8;

            ctx.beginPath();
            ctx.moveTo(0, 3);
            ctx.bezierCurveTo(side * s * 0.05, -s * 0.35, side * s * 0.52, -s * 0.85, side * s * 0.12, -s * 1.06);
            ctx.bezierCurveTo(-side * s * 0.25, -s * 0.9, -side * s * 0.28, -s * 0.25, 0, 3);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }


        const centerGrad = ctx.createLinearGradient(0, 4, 0, -s * 1.05);
        centerGrad.addColorStop(0, `hsl(${pal.h}, ${pal.s}%, ${pal.l - 10}%)`);
        centerGrad.addColorStop(0.5, `hsl(${pal.h}, ${pal.s}%, ${pal.l + 4}%)`);
        centerGrad.addColorStop(1, `hsl(${pal.h}, ${pal.s}%, ${pal.tip + 6}%)`);
        ctx.fillStyle = centerGrad;
        ctx.strokeStyle = `hsla(${pal.h}, ${pal.s}%, ${pal.l - 15}%, 0.35)`;
        ctx.lineWidth = 0.9;

        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.bezierCurveTo(-s * 0.44, -s * 0.18, -s * 0.38, -s * 0.88, 0, -s * 1.04);
        ctx.bezierCurveTo(s * 0.38, -s * 0.88, s * 0.44, -s * 0.18, 0, 4);
        ctx.fill();
        ctx.stroke();
    }


    function renderSunflower(ctx, size, bloom) {
        const s = size * bloom * 1.15;
        drawCalyx(ctx, s * 0.8, '#284f26');

        ctx.save();
        ctx.translate(0, -s * 0.22);

        const petalCount = 24;

        for (let layer = 0; layer < 2; layer++) {
            const offset = layer * (Math.PI / petalCount);
            const len = s * (layer === 0 ? 0.98 : 0.92);

            for (let i = 0; i < petalCount; i++) {
                const a = (i / petalCount) * Math.PI * 2 + offset;
                ctx.save();
                ctx.rotate(a);

                const pGrad = ctx.createLinearGradient(0, -s * 0.3, 0, -len);
                pGrad.addColorStop(0, '#d97706');
                pGrad.addColorStop(0.35, '#f59e0b');
                pGrad.addColorStop(1, '#fde047');

                ctx.fillStyle = pGrad;
                ctx.strokeStyle = 'rgba(180, 83, 9, 0.35)';
                ctx.lineWidth = 0.7;

                ctx.beginPath();
                ctx.moveTo(0, -s * 0.25);
                ctx.quadraticCurveTo(-s * 0.14, -len * 0.68, 0, -len);
                ctx.quadraticCurveTo(s * 0.14, -len * 0.68, 0, -s * 0.25);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }


        const discRadius = s * 0.42;
        const discGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, discRadius);
        discGrad.addColorStop(0, '#1f1005');
        discGrad.addColorStop(0.75, '#3b1e08');
        discGrad.addColorStop(1, '#78350f');
        ctx.fillStyle = discGrad;
        ctx.beginPath();
        ctx.arc(0, 0, discRadius, 0, Math.PI * 2);
        ctx.fill();


        const goldenAngle = 137.508 * (Math.PI / 180);
        const seeds = 75;
        for (let n = 1; n <= seeds; n++) {
            const r = (discRadius * 0.92) * Math.sqrt(n / seeds);
            const theta = n * goldenAngle;
            const sx = r * Math.cos(theta);
            const sy = r * Math.sin(theta);

            ctx.fillStyle = n > seeds * 0.75 ? '#f59e0b' : '#6b3e19';
            ctx.beginPath();
            ctx.arc(sx, sy, s * 0.022, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }


    function renderDaisy(ctx, size, bloom, variant) {
        const s = size * bloom * 0.92;
        drawCalyx(ctx, s * 0.75, '#2d5a2e');

        ctx.save();
        ctx.translate(0, -s * 0.18);

        const petals = 20;
        const isBlush = variant % 3 === 0;

        for (let i = 0; i < petals; i++) {
            const angle = (i / petals) * Math.PI * 2 + (i % 2) * 0.03;
            ctx.save();
            ctx.rotate(angle);

            const pGrad = ctx.createLinearGradient(0, -s * 0.2, 0, -s);
            pGrad.addColorStop(0, '#e2e8f0');
            pGrad.addColorStop(0.3, '#ffffff');
            pGrad.addColorStop(1, isBlush ? '#ffe4e6' : '#f8fafc');

            ctx.fillStyle = pGrad;
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
            ctx.lineWidth = 0.6;

            ctx.beginPath();
            ctx.moveTo(0, -s * 0.18);
            ctx.bezierCurveTo(-s * 0.12, -s * 0.5, -s * 0.1, -s * 0.95, 0, -s);
            ctx.bezierCurveTo(s * 0.1, -s * 0.95, s * 0.12, -s * 0.5, 0, -s * 0.18);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }


        const cRadius = s * 0.28;
        const cGrad = ctx.createRadialGradient(-cRadius * 0.2, -cRadius * 0.2, 1, 0, 0, cRadius);
        cGrad.addColorStop(0, '#fef08a');
        cGrad.addColorStop(0.65, '#f59e0b');
        cGrad.addColorStop(1, '#b45309');

        ctx.fillStyle = cGrad;
        ctx.beginPath();
        ctx.arc(0, 0, cRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }


    function renderLavender(ctx, size, bloom) {
        const spikeLen = size * 1.75 * bloom;


        ctx.strokeStyle = '#3b6638';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(0, 4);
        ctx.lineTo(0, -spikeLen);
        ctx.stroke();

        const tiers = 9;
        for (let t = 0; t < tiers; t++) {
            const progress = t / (tiers - 1);
            const y = -progress * spikeLen;
            const tierScale = (1 - progress * 0.45) * bloom;
            const budSize = size * 0.19 * tierScale;


            ctx.fillStyle = '#4a6b53';
            ctx.beginPath();
            ctx.arc(0, y + 2, budSize * 0.55, 0, Math.PI * 2);
            ctx.fill();


            const buds = [-1, 1, 0];
            for (const b of buds) {
                ctx.save();
                ctx.translate(b * budSize * 0.65, y);
                ctx.rotate(b * 0.42);

                const lGrad = ctx.createLinearGradient(0, 0, 0, -budSize * 2.2);
                lGrad.addColorStop(0, '#4c1d95');
                lGrad.addColorStop(0.5, '#7c3aed');
                lGrad.addColorStop(1, '#c4b5fd');

                ctx.fillStyle = lGrad;
                ctx.beginPath();
                ctx.ellipse(0, -budSize * 0.9, budSize * 0.62, budSize * 1.15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
    }


    function renderLily(ctx, size, bloom, variant) {
        const s = size * bloom * 1.18;
        drawCalyx(ctx, s * 0.65, '#2b592c');

        ctx.save();
        ctx.translate(0, -s * 0.15);

        const isPink = variant % 2 === 0;
        const baseColor = isPink ? '#fff1f2' : '#fefce8';
        const stripeColor = isPink ? '#fb7185' : '#fde047';
        const spotColor = isPink ? '#881337' : '#713f12';


        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2 + 0.25;
            const isInner = i % 2 === 1;
            const len = s * (isInner ? 1.02 : 0.94);
            const width = s * (isInner ? 0.34 : 0.28);

            ctx.save();
            ctx.rotate(angle);

            const lGrad = ctx.createLinearGradient(0, 0, 0, -len);
            lGrad.addColorStop(0, '#dcfce7');
            lGrad.addColorStop(0.2, stripeColor);
            lGrad.addColorStop(0.65, baseColor);
            lGrad.addColorStop(1, '#ffffff');

            ctx.fillStyle = lGrad;
            ctx.strokeStyle = 'rgba(225, 29, 72, 0.2)';
            ctx.lineWidth = 0.8;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-width, -len * 0.32, -width * 0.85, -len * 0.78, 0, -len);
            ctx.bezierCurveTo(width * 0.85, -len * 0.78, width, -len * 0.32, 0, 0);
            ctx.fill();
            ctx.stroke();


            ctx.strokeStyle = stripeColor;
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(0, -len * 0.08);
            ctx.lineTo(0, -len * 0.72);
            ctx.stroke();

            ctx.fillStyle = spotColor;
            for (let sp = 0; sp < 5; sp++) {
                const sy = -len * (0.2 + sp * 0.08);
                const sx = (sp % 2 === 0 ? 1 : -1) * width * 0.25;
                ctx.beginPath();
                ctx.arc(sx, sy, 1.3, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }


        for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2 + 0.4;
            const r = s * 0.38;
            const tx = Math.cos(a) * r;
            const ty = Math.sin(a) * r;

            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 1.1;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(tx * 0.4, ty * 0.4 - 4, tx, ty);
            ctx.stroke();

            ctx.save();
            ctx.translate(tx, ty);
            ctx.rotate(a);
            ctx.fillStyle = '#9a3412';
            ctx.beginPath();
            ctx.ellipse(0, 0, 3.8, 1.6, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        ctx.restore();
    }

    function renderGypsophila(ctx, size, bloom) {
        const s = size * bloom;
        const branches = [
            { dx: -s * 0.55, dy: -s * 0.75 },
            { dx: s * 0.55,  dy: -s * 0.7 },
            { dx: -s * 0.25, dy: -s * 1.05 },
            { dx: s * 0.3,   dy: -s * 0.98 },
            { dx: 0,         dy: -s * 0.55 }
        ];

        ctx.strokeStyle = 'rgba(74, 124, 78, 0.75)';
        ctx.lineWidth = 1.1;

        for (const b of branches) {
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.quadraticCurveTo(b.dx * 0.3, b.dy * 0.5, b.dx, b.dy);
            ctx.stroke();

            ctx.fillStyle = '#f8fafc';
            for (let p = 0; p < 5; p++) {
                const pa = (p / 5) * Math.PI * 2;
                ctx.beginPath();
                ctx.arc(b.dx + Math.cos(pa) * 2.5, b.dy + Math.sin(pa) * 2.5, 2.2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(b.dx, b.dy, 1.3, 0, Math.PI * 2);
            ctx.fill();
        }
    }


    class BouquetItem {
        constructor(config) {
            this.type = config.type;       // 'rose', 'tulip', 'sunflower', 'daisy', 'lavender', 'lily', 'gypsophila'
            this.tieX = config.tieX;
            this.tieY = config.tieY;
            this.targetX = config.targetX;
            this.targetY = config.targetY;
            this.depth = config.depth;     // 0 (vzadu) .. 1 (vpředu)
            this.size = config.size;
            this.variant = randInt(0, 10);


            const dx = this.targetX - this.tieX;
            const dy = this.tieY - this.targetY; // kladné číslo směrem nahoru
            const neckOffset = dx * 0.08 + rand(-6, 6);
            const tailLen = rand(58, 92);


            this.p0 = {
                x: this.tieX - dx * 0.24 + rand(-10, 10),
                y: this.tieY + tailLen
            };

            this.p1 = {
                x: this.tieX + neckOffset,
                y: this.tieY + 10
            };

            this.p2 = {
                x: this.tieX + dx * 0.62,
                y: this.tieY - dy * 0.58
            };

            this.baseP3 = {
                x: this.targetX,
                y: this.targetY
            };

            this.stemProgress = 0;
            this.stemSpeed = rand(0.018, 0.032);
            this.bloomProgress = 0;
            this.bloomSpeed = rand(0.022, 0.038);

            this.swayPhase = rand(0, Math.PI * 2);
            this.swayAmp = rand(2.5, 5.5) * (0.6 + this.depth * 0.5);

            const l = Math.round(22 + this.depth * 14);
            this.stemColor = `hsl(124, 38%, ${l}%)`;
            this.stemHighlight = `hsl(118, 42%, ${l + 10}%)`;
            this.stemWidth = this.type === 'gypsophila' ? 1.8 : (this.type === 'sunflower' ? 5.2 : rand(3.2, 4.6));

            this.leaves = [];
            if (this.type !== 'gypsophila') {
                const leafCount = randInt(1, 2);
                for (let i = 0; i < leafCount; i++) {
                    this.leaves.push({
                        t: rand(0.45, 0.78),
                        side: i % 2 === 0 ? 1 : -1,
                        size: rand(16, 26)
                    });
                }
            }
        }

        getAnimatedControlPoints(time) {
            const sway = Math.sin(time * 0.0016 + this.swayPhase) * this.swayAmp * this.bloomProgress;
            const swayY = Math.cos(time * 0.0016 + this.swayPhase) * (this.swayAmp * 0.25) * this.bloomProgress;
            return {
                p0: this.p0,
                p1: this.p1,
                p2: { x: this.p2.x + sway * 0.45, y: this.p2.y + swayY * 0.45 },
                p3: { x: this.baseP3.x + sway, y: this.baseP3.y + swayY }
            };
        }

        update() {
            if (this.stemProgress < 1) {
                this.stemProgress = Math.min(1, this.stemProgress + this.stemSpeed);
            } else if (this.bloomProgress < 1) {
                this.bloomProgress = Math.min(1, this.bloomProgress + this.bloomSpeed);
            }
        }

        draw(ctx, time) {
            if (this.stemProgress <= 0) return;

            const { p0, p1, p2, p3 } = this.getAnimatedControlPoints(time);
            const { q0, q1, q2, q3 } = subdivideCubicBezier(p0, p1, p2, p3, this.stemProgress);

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(q0.x, q0.y);
            ctx.bezierCurveTo(q1.x, q1.y, q2.x, q2.y, q3.x, q3.y);
            ctx.strokeStyle = this.stemColor;
            ctx.lineWidth = this.stemWidth;
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(q0.x - 0.6, q0.y);
            ctx.bezierCurveTo(q1.x - 0.6, q1.y, q2.x - 0.6, q2.y, q3.x - 0.6, q3.y);
            ctx.strokeStyle = this.stemHighlight;
            ctx.lineWidth = this.stemWidth * 0.3;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();

            for (const leaf of this.leaves) {
                if (this.stemProgress > leaf.t) {
                    const leafGrowth = clamp((this.stemProgress - leaf.t) * 4, 0, 1);
                    const pt = evalCubicPoint(p0, p1, p2, p3, leaf.t);
                    const tang = evalCubicTangentAngle(p0, p1, p2, p3, leaf.t);

                    ctx.save();
                    ctx.translate(pt.x, pt.y);
                    ctx.rotate(tang + leaf.side * 0.75);
                    ctx.scale(leafGrowth, leafGrowth);

                    const ls = leaf.size;
                    ctx.fillStyle = this.stemColor;
                    ctx.strokeStyle = this.stemHighlight;
                    ctx.lineWidth = 0.7;

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(ls * 0.5, -ls * 0.32, ls, 0);
                    ctx.quadraticCurveTo(ls * 0.5, ls * 0.32, 0, 0);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(ls * 0.8, 0);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            if (this.bloomProgress > 0) {
                const tipAngle = evalCubicTangentAngle(p0, p1, p2, p3, 1.0);
                let orientAngle = tipAngle + Math.PI / 2;

                if (this.type !== 'tulip' && this.type !== 'lavender') {
                    orientAngle *= 0.55;
                }

                const easeBloom = 1 - Math.pow(1 - this.bloomProgress, 3);

                ctx.save();
                ctx.shadowColor = 'rgba(5, 5, 15, 0.45)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetY = 4;

                ctx.translate(p3.x, p3.y);
                ctx.rotate(orientAngle);

                switch (this.type) {
                    case 'rose':       renderRose(ctx, this.size, easeBloom, this.variant); break;
                    case 'tulip':      renderTulip(ctx, this.size, easeBloom, this.variant); break;
                    case 'sunflower':  renderSunflower(ctx, this.size, easeBloom); break;
                    case 'daisy':      renderDaisy(ctx, this.size, easeBloom, this.variant); break;
                    case 'lavender':   renderLavender(ctx, this.size, easeBloom); break;
                    case 'lily':       renderLily(ctx, this.size, easeBloom, this.variant); break;
                    case 'gypsophila': renderGypsophila(ctx, this.size, easeBloom); break;
                }
                ctx.restore();
            }
        }
    }


    function drawPaperWrapBack(ctx, tieX, tieY, scale) {
        ctx.save();
        ctx.translate(tieX, tieY);
        ctx.scale(scale, scale);

        const backGrad = ctx.createLinearGradient(0, -240, 0, 30);
        backGrad.addColorStop(0, '#5c4738');
        backGrad.addColorStop(1, '#3b2c22');
        ctx.fillStyle = backGrad;

        ctx.beginPath();
        ctx.moveTo(0, 15);
        ctx.lineTo(-175, -155);
        ctx.lineTo(-95, -225);
        ctx.lineTo(0, -195);
        ctx.lineTo(105, -220);
        ctx.lineTo(175, -150);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(244, 235, 222, 0.14)';
        ctx.beginPath();
        ctx.moveTo(0, 10);
        ctx.lineTo(-145, -145);
        ctx.lineTo(-65, -195);
        ctx.lineTo(65, -195);
        ctx.lineTo(145, -145);
        ctx.closePath();
        ctx.fill();

        ctx.restore();
    }

    function drawPaperWrapFrontAndRibbon(ctx, tieX, tieY, scale) {
        ctx.save();
        ctx.translate(tieX, tieY);
        ctx.scale(scale, scale);

        ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
        ctx.shadowBlur = 15;
        ctx.shadowOffsetY = 6;

        const leftGrad = ctx.createLinearGradient(-120, -110, 20, 60);
        leftGrad.addColorStop(0, '#a68971');
        leftGrad.addColorStop(1, '#755c48');
        ctx.fillStyle = leftGrad;
        ctx.beginPath();
        ctx.moveTo(-135, -115);
        ctx.quadraticCurveTo(-55, -35, 16, 8);
        ctx.lineTo(24, 58);
        ctx.lineTo(-32, 66);
        ctx.quadraticCurveTo(-68, -10, -135, -115);
        ctx.fill();

        const rightGrad = ctx.createLinearGradient(120, -110, -20, 60);
        rightGrad.addColorStop(0, '#ba9c82');
        rightGrad.addColorStop(1, '#876b54');
        ctx.fillStyle = rightGrad;
        ctx.beginPath();
        ctx.moveTo(135, -115);
        ctx.quadraticCurveTo(55, -35, -18, 10);
        ctx.lineTo(-26, 62);
        ctx.lineTo(32, 66);
        ctx.quadraticCurveTo(68, -10, 135, -115);
        ctx.fill();

        const ribbonColor = '#b53856';
        const ribbonDark = '#7a1c33';
        const ribbonLight = '#d95b78';

        ctx.fillStyle = ribbonColor;
        ctx.strokeStyle = ribbonDark;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.roundRect(-24, -4, 48, 14, 5);
        ctx.fill();
        ctx.stroke();

        for (let side of [-1, 1]) {
            ctx.beginPath();
            ctx.moveTo(side * 6, 8);
            ctx.quadraticCurveTo(side * 28, 48, side * 36, 92);
            ctx.lineTo(side * 22, 84);
            ctx.lineTo(side * 16, 94);
            ctx.quadraticCurveTo(side * 12, 50, side * 2, 8);
            ctx.fillStyle = side === -1 ? ribbonColor : ribbonLight;
            ctx.fill();
            ctx.stroke();
        }

        for (let side of [-1, 1]) {
            const loopGrad = ctx.createLinearGradient(0, 0, side * 52, -18);
            loopGrad.addColorStop(0, ribbonDark);
            loopGrad.addColorStop(0.6, ribbonColor);
            loopGrad.addColorStop(1, ribbonLight);

            ctx.fillStyle = loopGrad;
            ctx.beginPath();
            ctx.moveTo(0, 3);
            ctx.bezierCurveTo(side * 42, -32, side * 58, 22, 0, 7);
            ctx.fill();
            ctx.stroke();
        }

        ctx.fillStyle = ribbonLight;
        ctx.beginPath();
        ctx.ellipse(0, 3, 9, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.restore();
    }


    let bouquetItems = [];
    let currentTie = { x: 0, y: 0, scale: 1 };

    function getActiveFlowerTypes() {
        return chips
            .filter(c => c.classList.contains('active'))
            .map(c => c.dataset.type);
    }

    function updateStatusText() {
        const active = getActiveFlowerTypes();
        const count = active.length;
        let word = 'druhů';
        if (count === 1) word = 'druh';
        else if (count >= 2 && count <= 4) word = 'druhy';
        statusEl.textContent = `Vybráno: ${count} ${word}`;
    }

    function buildBouquet() {
        let selectedTypes = getActiveFlowerTypes();


        if (selectedTypes.length === 0) {
            const randomChip = chips[randInt(0, chips.length - 1)];
            randomChip.classList.add('active');
            selectedTypes = [randomChip.dataset.type];
            updateStatusText();
        }


        quoteEl.textContent = quotes[randInt(0, quotes.length - 1)];

        const availableHeight = H - 175; // Rezerva pro spodní ovládací panel
        const tieX = W / 2;
        const tieY = clamp(availableHeight * 0.76, 260, H - 205);
        const scale = clamp(Math.min(W / 650, availableHeight / 560), 0.62, 1.15);

        currentTie = { x: tieX, y: tieY, scale };
        bouquetItems = [];

        const mainCount = W < 550 ? 15 : 19;
        const fillerCount = W < 550 ? 7 : 10;

        const maxRadiusX = 165 * scale;
        const maxRadiusY = 145 * scale;

        for (let i = 0; i < fillerCount; i++) {
            const angle = -Math.PI * 0.12 - (i / (fillerCount - 1)) * (Math.PI * 0.76) + rand(-0.06, 0.06);
            const dist = rand(0.75, 1.08);
            const tx = tieX + Math.cos(angle) * maxRadiusX * dist;
            const ty = (tieY - 65 * scale) + Math.sin(angle) * maxRadiusY * dist;

            bouquetItems.push(new BouquetItem({
                type: 'gypsophila',
                tieX,
                tieY,
                targetX: tx,
                targetY: ty,
                depth: rand(0.05, 0.35),
                size: 32 * scale
            }));
        }

        const slots = [];
        const rows = [
            { count: Math.floor(mainCount * 0.42), rMin: 0.78, rMax: 0.98, depthMin: 0.15, depthMax: 0.45 },
            { count: Math.floor(mainCount * 0.35), rMin: 0.48, rMax: 0.72, depthMin: 0.50, depthMax: 0.78 },
            { count: mainCount - Math.floor(mainCount * 0.42) - Math.floor(mainCount * 0.35), rMin: 0.22, rMax: 0.42, depthMin: 0.80, depthMax: 1.0 }
        ];

        for (const row of rows) {
            for (let i = 0; i < row.count; i++) {
                const u = row.count === 1 ? 0.5 : i / (row.count - 1);
                const angle = -Math.PI * 0.16 - u * (Math.PI * 0.68) + rand(-0.05, 0.05);
                const r = rand(row.rMin, row.rMax);
                const tx = tieX + Math.cos(angle) * maxRadiusX * r;
                const ty = (tieY - 62 * scale) + Math.sin(angle) * maxRadiusY * r;
                const depth = rand(row.depthMin, row.depthMax);
                slots.push({ tx, ty, depth });
            }
        }

        for (let i = 0; i < slots.length; i++) {
            const slot = slots[i];
            const flowerType = selectedTypes[i % selectedTypes.length];

            let baseSize = 36;
            if (flowerType === 'sunflower') baseSize = 42;
            else if (flowerType === 'lily') baseSize = 40;
            else if (flowerType === 'rose') baseSize = 37;
            else if (flowerType === 'tulip') baseSize = 35;
            else if (flowerType === 'daisy') baseSize = 32;
            else if (flowerType === 'lavender') baseSize = 34;

            const finalSize = baseSize * scale * (0.85 + slot.depth * 0.25);

            bouquetItems.push(new BouquetItem({
                type: flowerType,
                tieX,
                tieY,
                targetX: slot.tx,
                targetY: slot.ty,
                depth: slot.depth,
                size: finalSize
            }));
        }

        bouquetItems.sort((a, b) => a.depth - b.depth);
    }


    chips.forEach(chip => {
        chip.addEventListener('click', () => {
            chip.classList.toggle('active');
            updateStatusText();
            buildBouquet();
        });
    });

    document.getElementById('btnBind').addEventListener('click', () => {
        buildBouquet();
    });

    document.getElementById('btnSurprise').addEventListener('click', () => {
        // Náhodně vybere 2 až 5 druhů květin a přepne podle toho tlačítka
        const shuffled = [...chips].sort(() => Math.random() - 0.5);
        const pickCount = randInt(2, 5);

        chips.forEach(c => c.classList.remove('active'));
        for (let i = 0; i < pickCount; i++) {
            shuffled[i].classList.add('active');
        }

        updateStatusText();
        buildBouquet();
        spawnShootingStar(rand(W * 0.3, W * 0.8), rand(30, H * 0.25));
        setTimeout(() => spawnShootingStar(rand(W * 0.2, W * 0.7), rand(40, H * 0.3)), 260);
    });

    function handleResize() {
        W = window.innerWidth;
        H = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        for (const c of [skyCanvas, bqCanvas]) {
            c.width = W * dpr;
            c.height = H * dpr;
            const ctx = c.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        initSky();
        buildBouquet();
    }

    window.addEventListener('resize', handleResize);

    function animate(time) {
        renderSky(time);

        bqCtx.clearRect(0, 0, W, H);

        drawPaperWrapBack(bqCtx, currentTie.x, currentTie.y, currentTie.scale);

        for (const item of bouquetItems) {
            item.update();
            item.draw(bqCtx, time);
        }

        drawPaperWrapFrontAndRibbon(bqCtx, currentTie.x, currentTie.y, currentTie.scale);

        requestAnimationFrame(animate);
    }

    handleResize();
    requestAnimationFrame(animate);
})();
</script>
</body>
</html>
